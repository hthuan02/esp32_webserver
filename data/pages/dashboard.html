<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MEI CONNECT | Quản trị</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#f0f3f9;color:#263746;font-family:Arial,Helvetica,sans-serif}
    header{height:76px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #e2e7ed}
    .brand{font-size:25px}.brand strong{color:#168f91}.menu{position:relative}
    .menu-button,.submit{border:0;border-radius:9px;background:#108f91;color:#fff;padding:12px 18px;font-size:15px;cursor:pointer}
    .menu-list{display:none;position:absolute;right:0;top:48px;z-index:2;min-width:190px;padding:8px;background:#fff;border:1px solid #e1e5eb;border-radius:10px;box-shadow:0 8px 24px #1d355720}
    .menu-list.open{display:block}.menu-list a{display:block;padding:11px 12px;border-radius:7px;color:#263746;text-decoration:none}.menu-list a:hover{background:#eef4f6}
    main{width:min(760px,100%);margin:48px auto;padding:0 18px}
    .card{margin-bottom:22px;padding:26px;background:#fff;border:1px solid #e1e5eb;border-radius:16px;box-shadow:0 8px 28px #1d35570a}
    h1{margin:0 0 12px;font-size:27px}h2{margin:0 0 10px;font-size:21px}.muted{color:#74818b;line-height:1.6}
    .field{margin:18px 0}label{display:block;margin-bottom:8px;color:#65737e}
    input{width:100%;height:50px;padding:0 14px;border:1px solid #dce3eb;border-radius:9px;background:#f5f7fb;font-size:16px}
    .submit{margin-top:5px}
    @media(max-width:560px){header{padding:0 16px}.brand{font-size:21px}main{margin:28px auto}.card{padding:21px}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><strong>MEI</strong> CONNECT</div>
    <div class="menu">
      <button class="menu-button" type="button" onclick="document.getElementById('menu-list').classList.toggle('open')">☰ Menu</button>
      <nav class="menu-list" id="menu-list">
        <a href="/dashboard">Tổng quan</a>
        <a href="#wifi-settings" onclick="document.getElementById('menu-list').classList.remove('open')">Chuyển đổi Wi-Fi</a>
        <a href="/logout">Đăng xuất</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="card"><h1>Quản trị thiết bị</h1><p class="muted">Đăng nhập thành công. Chọn Menu ở phía trên để mở phần cấu hình Wi-Fi.</p></section>
    <section class="card" id="wifi-settings">
      <h2>Chuyển đổi Wi-Fi</h2>
      <p class="muted">Nhập tên và mật khẩu mạng Wi-Fi mới. Sau khi kết nối, địa chỉ IP mới sẽ được in trên Serial Monitor.</p>
      <form action="/wifi" method="post" autocomplete="off">
        <div class="field"><label for="ssid">Tên Wi-Fi (SSID)</label><input id="ssid" name="ssid" type="text" placeholder="Nhập tên Wi-Fi" required></div>
        <div class="field"><label for="wifi-password">Mật khẩu Wi-Fi</label><input id="wifi-password" name="password" type="password" placeholder="Nhập mật khẩu Wi-Fi"></div>
        <button class="submit" type="submit">Kết nối Wi-Fi mới</button>
      </form>
    </section>
  </main>
</body>
</html>
