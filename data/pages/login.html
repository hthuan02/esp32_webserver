<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f0f3f9">
  <title>MEI CONNECT | Đăng nhập</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#f0f3f9;color:#263746;font-family:Arial,Helvetica,sans-serif}
    .topbar{height:88px;flex:none;padding:0 30px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #e6e9ef}
    .brand{display:flex;align-items:center;gap:14px;font-size:28px;letter-spacing:-.5px}.brand strong{color:#168f91}
    .mark{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:#168f91;color:#fff;font-size:22px;font-weight:700;box-shadow:inset 0 0 0 2px #ffffff55}
    .theme{width:54px;height:52px;border:1px solid #e4e7ec;border-radius:12px;background:#fff;color:#263746;font-size:19px;cursor:pointer}
    main{width:min(1280px,100%);flex:1;margin:0 auto;padding:42px 28px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(410px,.85fr);gap:46px;align-items:center}
    .hero-image{margin:0;min-width:0}.hero-image img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:20px;box-shadow:0 18px 42px #1d355728}
    .card{width:100%;padding:28px 30px 68px;background:#fff;border:1px solid #e1e5eb;border-radius:19px;box-shadow:0 8px 28px #1d35570a}
    .eyebrow{margin:0 0 14px;color:#7c8992;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
    h1{margin:0 0 22px;color:#263746;font-size:30px;line-height:1.2}
    .field{margin:0 0 20px}label{display:block;margin-bottom:9px;color:#697781;font-size:15px}
    input{width:100%;height:56px;padding:0 16px;border:1px solid #e2e7ef;border-radius:11px;background:#eaf0fb;color:#17212b;font:16px Arial,sans-serif;outline:none}
    input:focus{border-color:#168f91;box-shadow:0 0 0 3px #168f9125;background:#fff}
    .submit{min-width:144px;height:52px;margin-top:7px;padding:0 22px;border:0;border-radius:11px;background:#108f91;color:#fff;font-size:17px;font-weight:600;cursor:pointer}
    .submit:hover{background:#087c7e}
    footer{flex:none;padding:0 16px 20px;text-align:center;color:#79858e;font-size:15px;line-height:1.7}footer span{color:#263746}
    body.dark{background:#161d27;color:#eaf0f5}
    body.dark .topbar,body.dark .card,body.dark .theme{background:#202a36;color:#eaf0f5;border-color:#334252}
    body.dark h1,body.dark footer span{color:#eaf0f5}
    body.dark label,body.dark .eyebrow,body.dark footer{color:#aab6c1}
    body.dark input{background:#293646;color:#f5f8fb;border-color:#39495a}
    @media(max-width:850px){main{grid-template-columns:1fr;gap:24px;max-width:600px;padding:28px 20px}.hero-image img{max-height:300px}.card{padding:26px 24px 38px}}
    @media(max-width:560px){.topbar{height:72px;padding:0 16px}.brand{gap:10px;font-size:22px}.mark{width:44px;height:44px;border-radius:12px}.theme{width:44px;height:44px}main{padding:20px 16px}.hero-image img{max-height:220px;border-radius:14px}h1{font-size:27px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="mark" aria-hidden="true">M</div><div><strong>MEI</strong> CONNECT</div></div>
    <button class="theme" type="button" aria-label="Đổi giao diện" onclick="document.body.classList.toggle('dark')">◐</button>
  </header>
  <main>
    <figure class="hero-image">
      <img src="/images/chip_image01.png" alt="Hình ảnh chip điện tử">
    </figure>
    <section class="card" aria-labelledby="login-title">
      <p class="eyebrow">Quản trị thiết bị</p>
      <h1 id="login-title">Đăng nhập</h1>
      <form action="/login" method="post" autocomplete="on">
        <div class="field"><label for="username">Tài khoản</label><input id="username" name="username" type="text" placeholder="Nhập tài khoản" autocomplete="username" required></div>
        <div class="field"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required></div>
        <button class="submit" type="submit">Đăng nhập</button>
      </form>
    </section>
  </main>
  <!-- <footer>MEIGROUP IOT, IIOT, AIOT<br><span>© 2026 Powered by MEIGROUP.VN</span></footer> -->
</body>
</html>
